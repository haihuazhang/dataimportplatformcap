_schema-version: 3.3.0
ID: batchimportcat
version: 1.0.0-SNAPSHOT
description: Batch import platform CAP application.
parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo

modules:
  - name: batchimportcat-srv
    type: java
    path: srv
    parameters:
      instances: 1
      memory: 1024M
      buildpack: sap_java_buildpack_jakarta
    properties:
      SPRING_PROFILES_ACTIVE: cloud
      BATCHIMPORT_TASK_LAUNCHER_TYPE: cloudfoundry
      BATCHIMPORT_TASK_HOST_APP: batchimportcat-batch-task
      BATCHIMPORT_TASK_CLOUDFOUNDRY_API_HOST: api.cf.us10-001.hana.ondemand.com
      BATCHIMPORT_TASK_CLOUDFOUNDRY_ORGANIZATION: ${org}
      BATCHIMPORT_TASK_CLOUDFOUNDRY_SPACE: ${space}
      BATCHIMPORT_TASK_CLOUDFOUNDRY_USERNAME: haihua.zhang@hand-china.com
      BATCHIMPORT_TASK_CLOUDFOUNDRY_PASSWORD: P@ssw0rd
      BATCHIMPORT_TASK_CLOUDFOUNDRY_COMMAND_TEMPLATE: "{defaultCommand} --fileUUID={fileUUID} --executionUUID={executionUUID}"
      JBP_CONFIG_COMPONENTS: "jres: ['com.sap.xs.java.buildpack.jre.SAPMachineJRE']"
      JBP_CONFIG_SAP_MACHINE_JRE: "{ version: 21.+ }"
    build-parameters:
      builder: custom
      commands:
        - mvn -f ../pom.xml -pl srv -am clean package -DskipTests -Dmaven.test.skip=true --batch-mode
      build-result: target/*-exec.jar
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: batchimportcat-auth
      - name: batchimportcat-db
      - name: batchimportcat-destination

  - name: batchimportcat-batch-task
    type: java
    path: batch-task
    parameters:
      memory: 1024M
      disk-quota: 1024M
      no-route: true
      no-start: true
      health-check-type: process
      buildpack: sap_java_buildpack_jakarta
    properties:
      SPRING_PROFILES_ACTIVE: cloud
      JBP_CONFIG_COMPONENTS: "jres: ['com.sap.xs.java.buildpack.jre.SAPMachineJRE']"
      JBP_CONFIG_SAP_MACHINE_JRE: "{ version: 21.+ }"
    build-parameters:
      builder: custom
      commands:
        - mvn -f ../pom.xml -pl batch-task -am clean package -DskipTests -Dmaven.test.skip=true --batch-mode
      build-result: target/*-exec.jar
    requires:
      - name: batchimportcat-auth
      - name: batchimportcat-db

  - name: batchimportcat-db-deployer
    type: hdb
    path: db
    parameters:
      buildpack: nodejs_buildpack
    build-parameters:
      builder: custom
      commands:
        - npm run build
    requires:
      - name: batchimportcat-db

  - name: zzdtimpconf
    type: html5
    path: app/zzdtimpconf
    build-parameters:
      builder: custom
      commands:
        - npm install
        - npm run build
      build-result: dist
      supported-platforms: []

  - name: zzdtimpfile
    type: html5
    path: app/zzdtimpfile
    build-parameters:
      builder: custom
      commands:
        - npm install
        - npm run build
      build-result: dist
      supported-platforms: []

  - name: zzdtimplog
    type: html5
    path: app/zzdtimplog
    build-parameters:
      builder: custom
      commands:
        - npm install
        - npm run build
      build-result: dist
      supported-platforms: []

  - name: zzdtimpproc
    type: html5
    path: app/zzdtimpproc
    build-parameters:
      builder: custom
      commands:
        - npm install
        - npm run build
      build-result: dist
      supported-platforms: []

  - name: batchimportcat-app-deployer
    type: com.sap.application.content
    path: .
    requires:
      - name: batchimportcat-auth
      - name: srv-api
      - name: batchimportcat-html5-repo-host
        parameters:
          content-target: true
          config:
            HTML5Runtime_enabled: true
    build-parameters:
      build-result: resources
      requires:
        - name: zzdtimpconf
          artifacts:
            - zzdtimpconf.zip
          target-path: resources/
        - name: zzdtimpfile
          artifacts:
            - zzdtimpfile.zip
          target-path: resources/
        - name: zzdtimplog
          artifacts:
            - zzdtimplog.zip
          target-path: resources/
        - name: zzdtimpproc
          artifacts:
            - zzdtimpproc.zip
          target-path: resources/

  - name: batchimportcat-destinations
    type: com.sap.application.content
    requires:
      - name: batchimportcat-auth
        parameters:
          service-key:
            name: batchimportcat-auth-key
      - name: batchimportcat-html5-repo-host
        parameters:
          service-key:
            name: batchimportcat-html5-repo-host-key
      - name: srv-api
      - name: batchimportcat-destination
        parameters:
          content-target: true
    build-parameters:
      no-source: true
    parameters:
      content:
        instance:
          existing_destinations_policy: update
          destinations:
            - Name: batchimportcat-html5-repository
              ServiceInstanceName: batchimportcat-html5-repo-host
              ServiceKeyName: batchimportcat-html5-repo-host-key
              sap.cloud.service: batchimportcat.service
            - Name: batchimportcat-auth
              Authentication: OAuth2UserTokenExchange
              ServiceInstanceName: batchimportcat-auth
              ServiceKeyName: batchimportcat-auth-key
              sap.cloud.service: batchimportcat.service

resources:
  - name: batchimportcat-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: batchimportcat-${org}-${space}
        tenant-mode: dedicated
        oauth2-configuration:
          credential-types:
            - binding-secret
            - x509

  - name: batchimportcat-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared

  - name: batchimportcat-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
      config:
        HTML5Runtime_enabled: true
        init_data:
          instance:
            existing_destinations_policy: update
            destinations:
              - Name: srv-api
                URL: ~{srv-api/srv-url}
                Authentication: NoAuthentication
                Type: HTTP
                ProxyType: Internet
                HTML5.ForwardAuthToken: true
                HTML5.DynamicDestination: true
    requires:
      - name: srv-api

  - name: batchimportcat-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host
